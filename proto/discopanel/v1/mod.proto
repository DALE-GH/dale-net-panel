syntax = "proto3";

package discopanel.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/discopanel/pkg/proto/discopanel/v1;discopanelv1";

// Server mod and plugin management.
service ModService {
  rpc ListMods(ListModsRequest) returns (ListModsResponse);
  rpc GetMod(GetModRequest) returns (GetModResponse);
  rpc ImportUploadedMod(ImportUploadedModRequest) returns (ImportUploadedModResponse);
  rpc UpdateMod(UpdateModRequest) returns (UpdateModResponse);
  rpc DeleteMod(DeleteModRequest) returns (DeleteModResponse);

  // Search the DALE-NET multi-provider plugin catalog.
  rpc SearchPluginCatalog(SearchPluginCatalogRequest) returns (SearchPluginCatalogResponse);
  // Resolve and install the latest compatible plugin release.
  rpc InstallPluginFromCatalog(InstallPluginFromCatalogRequest) returns (InstallPluginFromCatalogResponse);
}

message Mod {
  string id = 1;
  string server_id = 2;
  string file_name = 3;
  string display_name = 4;
  string description = 5;
  string version = 6;
  string mod_id = 7;
  string author = 8;
  string website = 9;
  int64 file_size = 10;
  google.protobuf.Timestamp uploaded_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  bool enabled = 13;
}

message ListModsRequest { string server_id = 1; }
message ListModsResponse { repeated Mod mods = 1; }
message GetModRequest { string server_id = 1; string mod_id = 2; }
message GetModResponse { Mod mod = 1; }

message ImportUploadedModRequest {
  string server_id = 1;
  string upload_session_id = 2;
  string display_name = 3;
  string description = 4;
}
message ImportUploadedModResponse { Mod mod = 1; string message = 2; }

message UpdateModRequest {
  string server_id = 1;
  string mod_id = 2;
  optional string display_name = 3;
  optional string description = 4;
  optional bool enabled = 5;
}
message UpdateModResponse { Mod mod = 1; }
message DeleteModRequest { string server_id = 1; string mod_id = 2; }
message DeleteModResponse { string message = 1; }

message PluginCatalogItem {
  string provider = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string author = 5;
  string website = 6;
  string icon_url = 7;
  int64 downloads = 8;
  int64 stars = 9;
  repeated string loaders = 10;
  repeated string game_versions = 11;
}

message SearchPluginCatalogRequest {
  string server_id = 1;
  string query = 2;
  repeated string providers = 3;
  int32 limit = 4;
}
message SearchPluginCatalogResponse {
  repeated PluginCatalogItem results = 1;
  repeated string warnings = 2;
}

message InstallPluginFromCatalogRequest {
  string server_id = 1;
  string provider = 2;
  string project_id = 3;
  bool replace_existing = 4;
}
message InstallPluginFromCatalogResponse {
  Mod mod = 1;
  string provider = 2;
  string version = 3;
  string message = 4;
}
